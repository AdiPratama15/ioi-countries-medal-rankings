<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IOI Countries — Ranked Medal Table</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d9e1ea;
      --header-1: #0f172a;
      --header-2: #1e293b;
      --accent: #2563eb;
      --gold-bg: #fff7d6;
      --gold-fg: #8a5a00;
      --silver-bg: #edf2f7;
      --silver-fg: #4b5563;
      --bronze-bg: #fbe8d8;
      --bronze-fg: #9a4a00;
      --total-bg: #e8f4ff;
      --total-fg: #0b5ea8;
      --rank-bg: #eef2ff;
      --rank-fg: #3730a3;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --row-hl: #f8fbff;
      --sticky-offset: 52px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 220px);
      color: var(--text);
    }

    .wrap {
      width: min(1300px, calc(100vw - 24px));
      margin: 20px auto 40px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px 18px 14px;
      margin-bottom: 14px;
    }

    .title {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .subtext {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      font-size: 1rem;
      outline: none;
    }

    .search input:focus {
      border-color: #7aa7ff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .pill, .btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 14px;
      background: #fff;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1;
      white-space: nowrap;
    }

    .btn {
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08); }
    .btn:active { transform: translateY(0); }

    .table-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    }

    .table-top .meta {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 860px;
    }

    thead th {
      position: sticky;
      z-index: 4;
      color: #fff;
      background: var(--header-1);
      text-align: center;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding: 14px 10px;
      white-space: nowrap;
    }

    thead tr:first-child th {
      top: 0;
      background: var(--header-1);
      font-size: 0.96rem;
    }

    thead tr:nth-child(2) th {
      top: var(--sticky-offset);
      background: var(--header-2);
      font-size: 0.9rem;
    }

    thead th.rank-head { background: #111827; }
    thead th.country-head { background: #111827; text-align: left; padding-left: 16px; }
    thead th.host-head { background: #111827; }
    thead th.gold-head { background: #7a5b00; }
    thead th.silver-head { background: #4b5563; }
    thead th.bronze-head { background: #8a4b16; }
    thead th.total-head { background: #0b5ea8; }

    tbody td {
      border-bottom: 1px solid var(--border);
      padding: 11px 10px;
      vertical-align: middle;
      background: #fff;
    }

    tbody tr:nth-child(even) td { background: #fbfdff; }
    tbody tr:hover td { background: var(--row-hl); }

    td.rank {
      text-align: center;
      font-weight: 800;
      color: var(--rank-fg);
      background: var(--rank-bg);
    }

    td.country {
      text-align: left;
      padding-left: 16px;
      min-width: 230px;
    }

    td.country a {
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
    }

    td.country a:hover { text-decoration: underline; }

    td.host {
      text-align: center;
      color: var(--muted);
      min-width: 110px;
    }

    td.num {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      min-width: 78px;
    }

    td.gold { background: var(--gold-bg); color: var(--gold-fg); }
    td.silver { background: var(--silver-bg); color: var(--silver-fg); }
    td.bronze { background: var(--bronze-bg); color: var(--bronze-fg); }
    td.total { background: var(--total-bg); color: var(--total-fg); }

    .empty {
      padding: 24px 18px;
      text-align: center;
      color: var(--muted);
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .highlight {
      background: rgba(37, 99, 235, 0.09) !important;
    }

    @media (max-width: 860px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .table-top {
        flex-direction: column;
        align-items: flex-start;
      }

      thead th {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

  <div class="wrap">
    <section class="hero">
      <div class="title">
        <h1>IOI Countries Medal Table</h1>
        <div class="pill">Default sort: Gold → Silver → Bronze → Total</div>
      </div>
      <div class="controls">

    <section class="table-shell">

            <col style="width: 110px;" />
            <col style="width: 110px;" />
            <col style="width: 110px;" />

          <tbody id="tbody"></tbody>
        </table>
        <div id="emptyState" class="empty" style="display:none;">No countries match your search.</div>
      </div>
    </section>
  </div>

    const tbody = document.getElementById('tbody');
    const filterInput = document.getElementById('filterInput');
    const clearBtn = document.getElementById('clearBtn');
    const resultCount = document.getElementById('resultCount');
    const emptyState = document.getElementById('emptyState');

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function setStickyOffset() {
      const firstHeaderRow = document.querySelector('thead tr:first-child');
      if (!firstHeaderRow) return;
      const h = firstHeaderRow.getBoundingClientRect().height;
      document.documentElement.style.setProperty('--sticky-offset', h + 'px');
    }

    function renderTable() {
      const q = filterInput.value.trim().toLowerCase();
      const filtered = q
        ? DATA.filter(row => {
            const hay = `${row.country} ${row.code} ${row.host}`.toLowerCase();
            return hay.includes(q);
          })
        : DATA;

      tbody.innerHTML = filtered.map(row => {
        const countryUrl = `https://stats.ioinformatics.org/countries/${row.code}`;
        return `
          <tr>
            <td class="rank">${row.rank}</td>
            <td class="country"><a href="${countryUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(row.country)}</a></td>
            <td class="host">${row.host ? escapeHtml(row.host) : '&mdash;'}</td>
            <td class="num gold">${row.gold}</td>
            <td class="num silver">${row.silver}</td>
            <td class="num bronze">${row.bronze}</td>
            <td class="num total">${row.total}</td>
          </tr>
        `;
      }).join('');

      const total = DATA.length;
      const shown = filtered.length;
      resultCount.textContent = q
        ? `Showing ${shown} of ${total} countries`
        : `Showing all ${total} countries`;

      emptyState.style.display = shown ? 'none' : 'block';
    }

    filterInput.addEventListener('input', renderTable);
    clearBtn.addEventListener('click', () => {
      filterInput.value = '';
      filterInput.focus();
      renderTable();
    });

    window.addEventListener('resize', setStickyOffset);
    window.addEventListener('load', () => {
      setStickyOffset();
      renderTable();
    });
    setStickyOffset();
    renderTable();
  </script>
